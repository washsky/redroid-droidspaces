# Complete image profile for the verified SM8475 / OS3.0.5.0.VMNCNXM host.
# REPLACE every REPLACE_* value with independently reserved, verified paths.
name=redroid13release
hostname=redroid13release
rootfs_path=/data/local/Droidspaces/Containers/redroid13release/rootfs.img
net_mode=nat
disable_ipv6=1
enable_android_storage=0
enable_hw_access=0
enable_gpu_mode=0
enable_x11=0
enable_virgl=0
enable_pulseaudio=0
selinux_permissive=0
allow_sandboxing=1
volatile_mode=0
bind_mounts=REPLACE_ASHMEM:/dev/ashmem,REPLACE_BINDER:/dev/binder,REPLACE_HWBINDER:/dev/hwbinder,REPLACE_VNDBINDER:/dev/vndbinder,/dev/kgsl-3d0:/dev/kgsl-3d0,/dev/dma_heap/system:/dev/dma_heap/system,/dev/video32:/dev/video32,/dev/video33:/dev/video33,/dev/kmsg:/dev/kmsg,/dev/null:/dev/null,/dev/zero:/dev/zero,/dev/random:/dev/random,/dev/urandom:/dev/urandom,/dev/tty:/dev/tty
upstream_interfaces=wlan0
port_forwards=15615:5555/tcp
static_nat_ip=172.28.41.40
run_at_boot=0
enable_anland=0
force_cgroupv1=0
use_sparse_image=1
sparse_image_size_gb=12
privileged=nocaps
memory_limit=2684354560
allow_swap=0
custom_init=/init.arm13-caps
