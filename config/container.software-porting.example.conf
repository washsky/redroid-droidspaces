# Software-first ARM64 porting reference, not a tested configuration for every phone.
# Use a NEW working copy. Resolve every REPLACE_* and check address/port availability.
name=redroid13software
hostname=redroid13software
rootfs_path=/data/local/Droidspaces/Containers/redroid13software/rootfs-working.img
net_mode=nat
upstream_interfaces=REPLACE_REAL_UPSTREAM_INTERFACE
static_nat_ip=172.28.41.50
port_forwards=15620:5555/tcp
disable_ipv6=1
enable_android_storage=0
enable_hw_access=0
enable_gpu_mode=0
enable_x11=0
enable_virgl=0
enable_pulseaudio=0
enable_anland=0
selinux_permissive=0
allow_sandboxing=0
volatile_mode=0
# Historical core startup baseline. Not a claim of least privilege or host isolation.
privileged=full
custom_init=/init.droidspaces
memory_limit=2684354560
allow_swap=0
run_at_boot=0
use_sparse_image=1
sparse_image_size_gb=6
bind_mounts=REPLACE_REAL_ASHMEM_NODE:/dev/ashmem,REPLACE_NEW_BINDER_NODE:/dev/binder,REPLACE_NEW_HWBINDER_NODE:/dev/hwbinder,REPLACE_NEW_VNDBINDER_NODE:/dev/vndbinder,/dev/null:/dev/null,/dev/zero:/dev/zero,/dev/random:/dev/random,/dev/urandom:/dev/urandom,/dev/tty:/dev/tty
