# Reference only. Replace all REPLACE_* values before use.
name=redroid13arm
hostname=redroid13arm
rootfs_path=/data/local/Droidspaces/Containers/redroid13arm/rootfs-hw-candidate.img
disable_ipv6=1
enable_x11=0
enable_android_storage=0
enable_virgl=0
enable_pulseaudio=0
enable_anland=0
enable_hw_access=0
enable_gpu_mode=0
selinux_permissive=0
allow_sandboxing=0
allow_vts=0
allow_swap=0
volatile_mode=0
force_cgroupv1=0
privileged=full
foreground=0
net_mode=nat
upstream_interfaces=wlan0
port_forwards=15613:5555/tcp
static_nat_ip=172.28.41.36
custom_init=/init.droidspaces
# Reserve independent BinderFS nodes for this Android container. Do not reuse
# the host or another container's nodes; do not delete live BinderFS nodes.
bind_mounts=REPLACE_REAL_ASHMEM_NODE:/dev/ashmem,REPLACE_BINDER_NODE:/dev/binder,REPLACE_HWBINDER_NODE:/dev/hwbinder,REPLACE_VNDBINDER_NODE:/dev/vndbinder,/dev/kgsl-3d0:/dev/kgsl-3d0,/dev/dma_heap/system:/dev/dma_heap/system,/dev/video32:/dev/video32,/dev/video33:/dev/video33,/dev/null:/dev/null,/dev/zero:/dev/zero,/dev/random:/dev/random,/dev/urandom:/dev/urandom,/dev/tty:/dev/tty
run_at_boot=0
use_sparse_image=1
sparse_image_size_gb=12
