<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARM13 Browser Regression</title><style>body{font:20px sans-serif;background:#142338;color:white}canvas{width:100%;height:160px}button{font-size:26px;padding:18px;background:#76d8b0}</style><h2>Browser graphics check</h2><p id="clock">Starting</p><canvas id="c" width="600" height="160"></canvas><p id="glinfo"></p><canvas id="g" width="600" height="160"></canvas><button onclick="this.textContent='Clicks: '+(++clicks)">Clicks: 0</button><p>Scroll and type test</p><input style="font-size:24px;width:90%" placeholder="type here"><div style="height:800px"></div><p>Scroll bottom reached</p><script>let clicks=0,n=0;const ctx=c.getContext('2d');const gl=g.getContext('webgl2')||g.getContext('webgl');glinfo.textContent=gl?'WebGL active: '+gl.getParameter(gl.VERSION):'WebGL unavailable';function tick(t){n++;ctx.fillStyle='#254f8e';ctx.fillRect(0,0,600,160);ctx.fillStyle='#ffb34d';ctx.fillRect((t/4)%500,20,100,120);if(gl){gl.clearColor((Math.sin(t/1200)+1)/2,0.35,0.75,1);gl.clear(gl.COLOR_BUFFER_BIT)}if(n%15===0)clock.textContent='Frames: '+n+' | seconds: '+Math.floor(t/1000);requestAnimationFrame(tick)}requestAnimationFrame(tick);</script>
